    },
    comex: function (g, col) {
      var cont = box(3.2, 1.3, 1.3, mat('#E2711D', { r: 0.6, m: 0.2 }), -1.8, 0.77, 2.9, g);
      for (var i = 0; i < 9; i++) box(0.04, 1.1, 1.32, mat('#B85A15'), -3.2 + i * 0.35, 0.77, 2.9, g);
      [[1.6, 2.8], [2.2, 3.4], [1.9, 3.0, 1]].forEach(function (p) { box(0.6, 0.5, 0.6, mat('#C9A06A'), p[0], 0.37 + (p[2] ? 0.5 : 0), p[1], g); });
      var globe = new THREE.Mesh(new THREE.SphereGeometry(0.42, 20, 16), mat('#5B8CFF', { r: 0.4 }));
      globe.position.set(3.4, 1.15, -2.9); g.add(globe);
      cyl(0.05, 0.05, 0.5, legMat, 3.4, 0.55, -2.9, g, 8);
      anims.push(function (t) { globe.rotation.y = t * 0.6; });
    },
    mkt: function (g, col) {
      cyl(0.6, 0.7, 0.5, mat(col, { r: 0.5 }), 0, 0.37, 2.6, g, 24);
      var mega = new THREE.Mesh(new THREE.ConeGeometry(0.35, 0.8, 20, 1, true), mat('#F4F1E8', { r: 0.5 }));
      mega.rotation.z = Math.PI / 2; mega.position.set(0, 1.25, 2.6); mega.castShadow = true; g.add(mega);
      var arrow = new THREE.Group(); arrow.position.set(-3.2, 0.2, 2.8); g.add(arrow);
      [0.5, 0.9, 1.4, 2.0].forEach(function (h, i) { box(0.35, h, 0.35, mat(col, { e: col, ei: 0.15 }), i * 0.45, h / 2, 0, arrow); });
      anims.push(function (t) { mega.rotation.x = Math.sin(t * 2) * 0.2; });
    },
    pm: function (g, col) {
      box(3.2, 1.9, 0.08, mat('#F4F1E8'), 0, 1.65, -4.3, g);
      var notes = ['#FFC93C', '#3CE0B0', '#FF3D8B', '#5B8CFF', '#FFC93C', '#3CE0B0', '#A98BFF', '#FF8A3D'];
      notes.forEach(function (c, i) { box(0.4, 0.4, 0.03, mat(c), -1.1 + (i % 3) * 1.1 + (i > 5 ? 0.55 : 0), 2.2 - Math.floor(i / 3) * 0.55, -4.24, g); });
      // Small building model
      [[0, 1.6], [1, 1.2], [2, 0.8], [3, 0.4]].forEach(function (f) { box(1.2 - f[0] * 0.05, 0.4, 1.0, mat(f[0] % 2 ? '#A98BFF' : '#D9CCFF'), 3.0, 0.3 + f[0] * 0.42, 2.8, g); });
    }
  };

  AREAS.slice(1).forEach(buildRoom);

  // Lobby: coffee bar + welcome rug
  var rug = new THREE.Mesh(new THREE.CylinderGeometry(3.2, 3.2, 0.04, 48), mat('#1D2438', { r: 1 }));
  rug.position.y = 0.03; rug.receiveShadow = true; scene.add(rug);
  var ring = new THREE.Mesh(new THREE.TorusGeometry(3.2, 0.05, 8, 64), new THREE.MeshBasicMaterial({ color: '#FFC93C' }));
  ring.rotation.x = Math.PI / 2; ring.position.y = 0.06; scene.add(ring);
  box(2.2, 1.0, 0.7, mat('#2A3150'), -16.5, 0.5, 0, null);
  cyl(0.18, 0.18, 0.5, mat('#C9CED8', { m: 0.6, r: 0.3 }), -16.9, 1.25, 0, null);

  /* ---------- Characters ---------- */
  var skins = ['#C68B59', '#8D5524', '#E0AC69', '#F1C27D', '#B07A4A'];
  var hairs = ['#1B1210', '#3B2416', '#0E0E10', '#5A3A22'];
  function person(shirt, opts) {
    opts = opts || {};
    var g = new THREE.Group();
    var skin = mat(opts.skin || skins[Math.floor(Math.random() * skins.length)], { r: 0.8 });
    var pants = mat(opts.pants || '#2B3350');
    var body = cyl(0.26, 0.3, 0.62, mat(shirt, { r: 0.6 }), 0, 0.95, 0, g, 14);
    var head = new THREE.Mesh(new THREE.SphereGeometry(0.24, 18, 14), skin); head.position.y = 1.5; head.castShadow = true; g.add(head);
    var hair = new THREE.Mesh(new THREE.SphereGeometry(0.255, 18, 14, 0, Math.PI * 2, 0, Math.PI * 0.55), mat(opts.hair || hairs[Math.floor(Math.random() * hairs.length)], { r: 0.9 }));
    hair.position.y = 1.53; hair.rotation.x = -0.25; g.add(hair);
    if (opts.longHair) { var lh = box(0.42, 0.5, 0.12, mat(opts.hair || '#1B1210', { r: 0.9 }), 0, 1.3, -0.17, g); }
    [-0.09, 0.09].forEach(function (x) { var e = new THREE.Mesh(new THREE.SphereGeometry(0.03, 8, 8), new THREE.MeshBasicMaterial({ color: '#141414' })); e.position.set(x, 1.53, 0.22); g.add(e); });
    function limb(x, y, len, m) { var p = new THREE.Group(); p.position.set(x, y, 0); g.add(p); box(0.13, len, 0.13, m, 0, -len / 2, 0, p); return p; }
    var lL = limb(-0.12, 0.64, 0.6, pants), lR = limb(0.12, 0.64, 0.6, pants);
    var aL = limb(-0.34, 1.2, 0.5, mat(shirt, { r: 0.6 })), aR = limb(0.34, 1.2, 0.5, mat(shirt, { r: 0.6 }));
    g.userData = { legs: [lL, lR], arms: [aL, aR], body: body };
    return g;
  }

  var people = [];
  var lobbySpots = [[-15.2, 1.2], [-15.2, -1.2], [-1.5, 1.5], [1.5, -1.5], [16, 0], [-5.5, 0], [5.5, 0]];
  function randIn(area) { var h = ROOM / 2 - 1; return new THREE.Vector3(area.pos[0] + (Math.random() * 2 - 1) * h, 0, area.pos[1] + (Math.random() * 2 - 1) * h + 0.6); }
  AREAS.slice(1).forEach(function (a) {
    for (var i = 0; i < 2; i++) {
      var p = person(a.color);
      var start = randIn(a); p.position.copy(start); scene.add(p);
      people.push({ obj: p, area: a, target: randIn(a), speed: 1.1 + Math.random() * 0.5, wait: Math.random() * 3, phase: Math.random() * 6 });
    }
  });
  // Jaqueline in the lobby
  var me = person('#FF3D8B', { skin: '#C68B59', hair: '#120C0A', longHair: true, pants: '#1D2438' });
  me.scale.set(1.18, 1.18, 1.18); me.position.set(0, 0, 0); scene.add(me);
  var meData = { obj: me, phase: 0 };

  /* ---------- Bubbles ---------- */
  var layer = document.getElementById('bubbles');
  var tag = document.createElement('div'); tag.className = 'nameTag'; tag.textContent = 'Jaqueline'; layer.appendChild(tag);
  var meBubble = document.createElement('div'); meBubble.className = 'bubble me'; meBubble.textContent = '¡Hola! Toca una sala para ver mis proyectos 👋'; layer.appendChild(meBubble);
  var active = [];
  function speak(pp) {
    if (active.some(function (b) { return b.p === pp; })) return;
    var el = document.createElement('div'); el.className = 'bubble';
    var fr = pp.area.frases; el.textContent = fr[Math.floor(Math.random() * fr.length)];
    layer.appendChild(el); active.push({ p: pp, el: el, until: performance.now() + 3600 });
  }
  var v3 = new THREE.Vector3();
  function place(el, obj, yOff) {
    v3.set(obj.position.x, yOff, obj.position.z).project(camera);
    var vis = v3.z < 1 && v3.x > -1.2 && v3.x < 1.2 && v3.y > -1.2 && v3.y < 1.2;
    el.style.display = vis ? '' : 'none';
    if (!vis) return;
    el.style.left = ((v3.x + 1) / 2 * window.innerWidth) + 'px';
    el.style.top = ((1 - v3.y) / 2 * window.innerHeight) + 'px';
  }

  /* ---------- Camera control ---------- */
  var target = new THREE.Vector3(0, 0, 0), targetGoal = target.clone();
  var theta = 0.65, phi = 0.95, radius = 34, radiusGoal = 34;
  var dragging = false, lastX = 0, lastY = 0, moved = 0, idle = 0, pinch = null;
  function updateCamera() {
    camera.position.set(target.x + radius * Math.sin(phi) * Math.sin(theta), radius * Math.cos(phi), target.z + radius * Math.sin(phi) * Math.cos(theta));
    camera.lookAt(target);
  }
  canvas.addEventListener('pointerdown', function (e) { dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY; canvas.classList.add('drag'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove', function (e) {
    if (!dragging || pinch) return;
    var dx = e.clientX - lastX, dy = e.clientY - lastY; lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx) + Math.abs(dy);
    theta -= dx * 0.006; phi = Math.min(1.35, Math.max(0.35, phi - dy * 0.004)); idle = 0;
  });
  canvas.addEventListener('pointerup', function (e) {
    canvas.classList.remove('drag'); dragging = false;
    if (moved < 6) pick(e.clientX, e.clientY);
  });
  canvas.addEventListener('wheel', function (e) { e.preventDefault(); radiusGoal = Math.min(55, Math.max(9, radiusGoal * (1 + e.deltaY * 0.001))); idle = 0; }, { passive: false });
  canvas.addEventListener('touchstart', function (e) { if (e.touches.length === 2) { pinch = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); } }, { passive: true });
  canvas.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinch) {
      var d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
      radiusGoal = Math.min(55, Math.max(9, radiusGoal * pinch / d)); pinch = d; moved = 99;
    }
  }, { passive: true });
  canvas.addEventListener('touchend', function (e) { if (e.touches.length < 2) pinch = null; }, { passive: true });

  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
  function pick(x, y) {
    ndc.set(x / window.innerWidth * 2 - 1, -(y / window.innerHeight) * 2 + 1);
    ray.setFromCamera(ndc, camera);
    var hit = ray.intersectObjects(pickables)[0];
    select(hit ? hit.object.userData.zone : 'todo');
  }
  onSelect = function (id) {
    idle = 0;
    Object.keys(rooms).forEach(function (k) { rooms[k].label.material.opacity = (id === 'todo' || id === k) ? 1 : 0.2; });
    if (id === 'todo') { targetGoal.set(0, 0, 0); radiusGoal = window.innerWidth < 640 ? 46 : 34; meBubble.textContent = '¡Hola! Toca una sala para ver mis proyectos 👋'; }
    else {
      var r = rooms[id]; targetGoal.copy(r.center); radiusGoal = window.innerWidth < 640 ? 19 : 15;
      meBubble.textContent = 'Esta es mi sala de ' + byId[id].nombre.toLowerCase() + ' ✨';
      people.forEach(function (pp) { if (pp.area.id === id) speak(pp); });
    }
  };

  function size() {
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false); camera.aspect = w / h;
    if (w < 640) camera.setViewOffset(w, h, 0, h * 0.2, w, h); else camera.clearViewOffset();
    camera.updateProjectionMatrix();
    if (current === 'todo') radiusGoal = w < 640 ? 46 : 34;
  }
  window.addEventListener('resize', size); size(); radius = radiusGoal;

  /* ---------- Loop ---------- */
  var clock = new THREE.Clock(), nextTalk = 1.5, running = true;
  document.addEventListener('visibilitychange', function () { running = !document.hidden; if (running) { clock.getDelta(); requestAnimationFrame(loop); } });
  function walk(o, t, amp) {
    var u = o.userData;
    u.legs[0].rotation.x = Math.sin(t) * amp; u.legs[1].rotation.x = -Math.sin(t) * amp;
    u.arms[0].rotation.x = -Math.sin(t) * amp * 0.8; u.arms[1].rotation.x = Math.sin(t) * amp * 0.8;
  }
  function loop() {
    if (!running) return;
    var dt = Math.min(clock.getDelta(), 0.05), t = clock.elapsedTime;
    var motion = reduce ? 0 : 1;

    people.forEach(function (pp) {
      var o = pp.obj;
      if (pp.wait > 0) { pp.wait -= dt; walk(o, 0, 0); return; }
      var dir = pp.target.clone().sub(o.position); dir.y = 0;
      var dist = dir.length();
      if (dist < 0.15) {
        pp.wait = 1.5 + Math.random() * 3.5;
        if (Math.random() < 0.2) { var s = lobbySpots[Math.floor(Math.random() * lobbySpots.length)]; pp.target = new THREE.Vector3(s[0], 0, s[1]); }
        else pp.target = randIn(pp.area);
        return;
      }
      dir.normalize();
      o.position.addScaledVector(dir, Math.min(dist, pp.speed * dt * motion));
      var ang = Math.atan2(dir.x, dir.z), da = ang - o.rotation.y;
      while (da > Math.PI) da -= Math.PI * 2; while (da < -Math.PI) da += Math.PI * 2;
      o.rotation.y += da * Math.min(1, dt * 8);
      pp.phase += dt * 9 * motion;
      walk(o, pp.phase, 0.6 * motion);
      o.position.y = Math.abs(Math.sin(pp.phase)) * 0.05 * motion;
    });

    // Jaqueline waves and turns toward the camera
    var camAng = Math.atan2(camera.position.x - me.position.x, camera.position.z - me.position.z);
    me.rotation.y += (camAng - me.rotation.y) * 0.05;
    me.userData.arms[1].rotation.z = 2.4 + Math.sin(t * 6) * 0.35 * motion;
    me.userData.arms[1].rotation.x = 0;

    anims.forEach(function (f) { f(reduce ? 0 : t); });

    if (!reduce && t > nextTalk) { speak(people[Math.floor(Math.random() * people.length)]); nextTalk = t + 1.6 + Math.random() * 1.6; }

    // Camera ease + idle auto-rotation
    idle += dt;
    if (!dragging && idle > 4 && !reduce) theta += dt * 0.05;
    target.lerp(targetGoal, Math.min(1, dt * 3));
    radius += (radiusGoal - radius) * Math.min(1, dt * 3);
    updateCamera();
    renderer.render(scene, camera);

    // Bubbles
    var now = performance.now();
    active = active.filter(function (b) {
      if (now > b.until) { b.el.remove(); return false; }
      place(b.el, b.p.obj, 2.15); return true;
    });
    place(meBubble, me, 2.55);
    place(tag, me, -0.1);

    requestAnimationFrame(loop);
  }
  updateCamera();
  requestAnimationFrame(loop);
})();
</script>
</body></html>
